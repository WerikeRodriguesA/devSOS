# =====================================================================
# DevSOS Backend — configuração padrão (banco via Docker :5433)
# =====================================================================
spring.application.name=devsos-backend

# Banco de dados (container devsos-db criado no fluxo do projeto)
spring.datasource.url=jdbc:postgresql://localhost:5433/devsos
spring.datasource.username=devsos
spring.datasource.password=devsos
spring.datasource.driver-class-name=org.postgresql.Driver

# Não deixamos o Hibernate criar/alterar schema de tabelas:
# a DDL versionada vive em db/migration e é aplicada pelo Flyway no boot.
spring.jpa.hibernate.ddl-auto=none

# Desativa o anti-pattern "open-in-view": sem isso, o Hibernate mantém a
# sessão JPA aberta durante a renderização da resposta — um risco real de
# N+1 escondido e conexões longas. Com false, a sessão abre/fecha só na
# camada de serviço (melhor prática).
spring.jpa.open-in-view=false

# Mostra no console o SQL gerado — ótimo para estudo em desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson: UTC em vez de formato local
spring.jackson.time-zone=UTC

# =====================================================================
# Flyway (migrações versionadas de schema)
#   * Aplicadas automaticamente no boot, ANTES do Hibernate validar as
#     entidades. Migrações vivem em src/main/resources/db/migration/.
#   * baseline-on-migrate: bancos de DEV que já tinham o schema criado "na
#     mão" (sem histórico do Flyway) são baselinados na versão 1 — o V1
#     (schema atual completo) é pulado, e somente as próximas migrações
#     (V2 em diante) rodam. Em banco novo/vazio o V1 aplica a DDL completa.
# =====================================================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =====================================================================
# Autenticação JWT
#   * O secret é apenas para DESENVOLVIMENTO local. Em produção, defina a
#     variável de ambiente DEV_SOS_JWT_SECRET antes de subir a aplicação.
#   * expiração em segundos (1 hora).
#   * refresh-expiracao-segundos: vida útil do refresh token OPACO (7 dias).
#     Ele é quem permite renovar o access JWT sem relogar e é REVOGÁVEL
#     (logout / logout forçado) — ao contrário do JWT, que é stateless.
# =====================================================================
devsos.jwt.secret=${DEV_SOS_JWT_SECRET:devsos-chave-desenvolvimento-local-nao-usar-em-producao}
devsos.jwt.expiracao-segundos=${DEV_SOS_JWT_EXPIRACAO:3600}
devsos.jwt.refresh-expiracao-segundos=${DEV_SOS_JWT_REFRESH_EXPIRACAO:604800}

# =====================================================================
# Conta — recuperação/troca de senha
#   * reset-expiracao-segundos: vida útil do token de recuperação (30 min).
#   * reset-link-base: base do link enviado (tela de reset do cliente web).
#   * expor-token-reset: SOMENTE DEV/TESTE. Quando true, /forgot-password
#     devolve o token no corpo (não há provedor de e-mail na fase 1). Em
#     produção deixe false — o token vai só para o log/notificação.
# =====================================================================
devsos.auth.reset-expiracao-segundos=${DEV_SOS_AUTH_RESET_EXPIRACAO:1800}
devsos.auth.reset-link-base=${DEV_SOS_AUTH_RESET_LINK_BASE:http://localhost:5173/reset-password}
devsos.auth.expor-token-reset=${DEV_SOS_AUTH_EXPOR_TOKEN:false}

# =====================================================================
# CORS (dev-gated)
#   Origem(s) autorizada(s) a consumir a API de um navegador (separada por
#   vírgula). Serve o "Dev Client Web" (ferramenta interna de desenvolvimento/
#   demonstração). O app mobile NÃO depende disto (não roda em navegador).
#   Vazio (padrão) = comportamento original: nenhuma origem é liberada.
#   Ex.: DEV_SOS_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
# =====================================================================
devsos.cors.allowed-origins=${DEV_SOS_CORS_ALLOWED_ORIGINS:}

# =====================================================================
# Upload de imagens (multipart) + object storage S3-compatível (MinIO local)
#   * Spring lê o multipart/chunk antes do Controller: arquivo acima de
#     max-file-size vira MaxUploadSizeExceededException -> 413 no enum
#     (max-request-size é o tamanho total da requisição multipart, um pouco
#     maior que o arquivo por causa da parte "extra" do protocolo).
#   * Storage: sem DEV_SOS_STORAGE_ENDPOINT o storage fica DESLIGADO e o
#     upload responde 503. Endpoint do MinIO local (dev): http://localhost:9000
#     (container devsos-minio iniciado pelo devsos-up.ps1).
# =====================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
devsos.storage.endpoint=${DEV_SOS_STORAGE_ENDPOINT:}
devsos.storage.access-key=${DEV_SOS_STORAGE_ACCESS_KEY:}
devsos.storage.secret-key=${DEV_SOS_STORAGE_SECRET_KEY:}
devsos.storage.bucket=${DEV_SOS_STORAGE_BUCKET:devsos}
devsos.storage.region=${DEV_SOS_STORAGE_REGION:us-east-1}

# =====================================================================
# Rate limiting (anti brute-force em rotas públicas)
#   POST /api/auth/login e /register são públicos: sem teto, viram alvo fácil
#   de brute force de senha e criação em massa de contas. O filtro limita por
#   IP (rota+IP) numa janela e responde 429 + Retry-After ao estourar. Quem
#   insiste leva cooldown progressivo (dobra a cada estouro, até max-cooldown).
#   O feed (GET /api/posts) tem teto bem mais folgado por ser leitura pública.
#   Variáveis de ambiente: DEV_SOS_RATE_LIMIT_* (ver RateLimitProperties).
# =====================================================================
devsos.rate-limit.enabled=${DEV_SOS_RATE_LIMIT_ENABLED:true}
devsos.rate-limit.login.limite=${DEV_SOS_RATE_LIMIT_LOGIN:5}
devsos.rate-limit.login.janela-segundos=${DEV_SOS_RATE_LIMIT_LOGIN_JANELA:60}
devsos.rate-limit.register.limite=${DEV_SOS_RATE_LIMIT_REGISTER:5}
devsos.rate-limit.register.janela-segundos=${DEV_SOS_RATE_LIMIT_REGISTER_JANELA:60}
devsos.rate-limit.refresh.limite=${DEV_SOS_RATE_LIMIT_REFRESH:10}
devsos.rate-limit.refresh.janela-segundos=${DEV_SOS_RATE_LIMIT_REFRESH_JANELA:60}
devsos.rate-limit.feed.limite=${DEV_SOS_RATE_LIMIT_FEED:60}
devsos.rate-limit.feed.janela-segundos=${DEV_SOS_RATE_LIMIT_FEED_JANELA:60}
devsos.rate-limit.max-cooldown-segundos=${DEV_SOS_RATE_LIMIT_MAX_COOLDOWN:300}
# Só use true atrás de um proxy reverso CONFIÁVEL: o X-Forwarded-For é forjável.
devsos.rate-limit.trust-forwarded-header=${DEV_SOS_RATE_LIMIT_TRUST_PROXY:false}

# =====================================================================
# Perfil LOCAL: aponta para o mesmo banco, porém com validação de schema
# (banco real já criado; Hibernate só valida se as colunas batem)
# Rodar com:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate