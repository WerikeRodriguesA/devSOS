# =====================================================================
# DevSOS Backend — configuração padrão (banco via Docker :5433)
# =====================================================================
spring.application.name=devsos-backend

# Banco de dados (container devsos-db criado no fluxo do projeto)
spring.datasource.url=jdbc:postgresql://localhost:5433/devsos
spring.datasource.username=devsos
spring.datasource.password=devsos
spring.datasource.driver-class-name=org.postgresql.Driver

# Não deixamos o Hibernate criar/alterar schema de tabelas:
# a DDL versionada vive em db/migration e é aplicada pelo Flyway no boot.
spring.jpa.hibernate.ddl-auto=none

# Desativa o anti-pattern "open-in-view": sem isso, o Hibernate mantém a
# sessão JPA aberta durante a renderização da resposta — um risco real de
# N+1 escondido e conexões longas. Com false, a sessão abre/fecha só na
# camada de serviço (melhor prática).
spring.jpa.open-in-view=false

# Mostra no console o SQL gerado — ótimo para estudo em desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson: UTC em vez de formato local
spring.jackson.time-zone=UTC

# =====================================================================
# Flyway (migrações versionadas de schema)
#   * Aplicadas automaticamente no boot, ANTES do Hibernate validar as
#     entidades. Migrações vivem em src/main/resources/db/migration/.
#   * baseline-on-migrate: bancos de DEV que já tinham o schema criado "na
#     mão" (sem histórico do Flyway) são baselinados na versão 1 — o V1
#     (schema atual completo) é pulado, e somente as próximas migrações
#     (V2 em diante) rodam. Em banco novo/vazio o V1 aplica a DDL completa.
# =====================================================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =====================================================================
# Autenticação JWT
#   * O secret é apenas para DESENVOLVIMENTO local. Em produção, defina a
#     variável de ambiente DEV_SOS_JWT_SECRET antes de subir a aplicação.
#   * expiração em segundos (1 hora).
# =====================================================================
devsos.jwt.secret=${DEV_SOS_JWT_SECRET:devsos-chave-desenvolvimento-local-nao-usar-em-producao}
devsos.jwt.expiracao-segundos=${DEV_SOS_JWT_EXPIRACAO:3600}

# =====================================================================
# Perfil LOCAL: aponta para o mesmo banco, porém com validação de schema
# (banco real já criado; Hibernate só valida se as colunas batem)
# Rodar com:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate