# =====================================================================
# DevSOS Backend — perfil TESTE (issue #13)
#   * Usa um banco SEPARADO (devsos_test), criado via:
#       docker exec devsos-db psql -U devsos -c "CREATE DATABASE devsos_test OWNER devsos;"
#   * Flyway aplica TODAS as migrações do zero nesse banco a cada teste
#     (baseline vazio), então o teste de concorrência nunca vê resíduo
#     de outros fluxos.
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/devsos_test
spring.datasource.username=devsos
spring.datasource.password=devsos

# Flyway do zero (sem baseline) para o banco de teste
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=false

# Sem ruído de SQL no console do teste
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false